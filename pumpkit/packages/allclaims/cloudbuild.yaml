# Cloud Build config for deploying the all-claims firehose bot to Cloud Run.
#
# Usage (from this directory):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=SHORT_SHA=manual$(date +%s)
#
# Prefer ./deploy-cloudrun.sh for a normal deploy: it also syncs the Telegram
# token into Secret Manager and ships the runtime env as a YAML file. This
# config only builds and releases the image, so env vars and the token secret
# must already be set on the service.
#
# serviceAccount is pinned because the project's default compute service
# account was deleted; an unpinned build fails immediately.

serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/three-ws-build@${PROJECT_ID}.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE: pumpfun-allclaims-bot
  _REGION: us-central1
  _REPO: gcr.io/$PROJECT_ID
  _RUNTIME_SA: three-ws@$PROJECT_ID.iam.gserviceaccount.com

steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REPO}/${_SERVICE}:$SHORT_SHA', '-t', '${_REPO}/${_SERVICE}:latest', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REPO}/${_SERVICE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--service-account=${_RUNTIME_SA}'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--no-cpu-throttling'
      - '--memory=2Gi'
      - '--port=3000'
      - '--no-allow-unauthenticated'

images:
  - '${_REPO}/${_SERVICE}:$SHORT_SHA'
  - '${_REPO}/${_SERVICE}:latest'
